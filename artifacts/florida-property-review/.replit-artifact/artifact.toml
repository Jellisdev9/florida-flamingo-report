kind = "web"
previewPath = "/"
title = "Florida Property Review"
version = "1.0.0"
id = "artifacts/florida-property-review"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19143

[services.development]
run = "pnpm --filter @workspace/florida-property-review run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/florida-property-review", "run", "build" ]
publicDir = "artifacts/florida-property-review/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19143"
BASE_PATH = "/"
